---
- name: Run Node Exporter on the project network
  community.docker.docker_container:
    name: "{{ node_exporter_container }}"
    image: "{{ node_exporter_image }}"
    state: started
    restart_policy: unless-stopped
    pid_mode: host
    command:
      - --path.rootfs=/host
    volumes:
      - "/:/host:{{ node_exporter_root_mount_options }}"
    network_mode: "{{ monitoring_network }}"
    networks:
      - name: "{{ monitoring_network }}"
