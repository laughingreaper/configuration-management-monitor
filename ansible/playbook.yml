---
- name: Configure the project monitoring stack
  hosts: controller
  gather_facts: false

  pre_tasks:
    - name: Verify that Terraform's monitoring containers are running
      ansible.builtin.command:
        argv: [docker, inspect, --format, "{% raw %}{{.State.Running}}{% endraw %}", "{{ item }}"]
      loop:
        - "{{ prometheus_container }}"
        - "{{ grafana_container }}"
      register: monitoring_container_state
      changed_when: false
      check_mode: false
      failed_when: monitoring_container_state.rc != 0 or monitoring_container_state.stdout != 'true'

  roles:
    - monitored_host
    - monitoring_server
